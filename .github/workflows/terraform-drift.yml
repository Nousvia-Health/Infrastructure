name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-drift
  cancel-in-progress: true

jobs:
  drift-check:
    name: drift-readonly-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_BACKEND_LOCATION: ${{ vars.TF_BACKEND_LOCATION || 'eastus' }}
      TF_VAR_FILE: ${{ vars.TF_VAR_FILE || 'config/dev.tfvars' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure backend names
        shell: bash
        run: |
          deploy_environment="${{ vars.TF_STATE_ENVIRONMENT || 'dev' }}"
          subscription_suffix="$(printf '%s' "$ARM_SUBSCRIPTION_ID" | tr -d '-' | cut -c1-9 | tr '[:upper:]' '[:lower:]')"
          backend_resource_group="${TF_BACKEND_RESOURCE_GROUP:-rg-nousvia-tfstate-${deploy_environment}}"
          backend_storage_account="${TF_BACKEND_STORAGE_ACCOUNT:-stnousviatf${deploy_environment}${subscription_suffix}}"
          backend_container="${TF_BACKEND_CONTAINER:-tfstate}"
          state_key="${TF_STATE_KEY:-${deploy_environment}/infrastructure.tfstate}"

          {
            echo "TF_BACKEND_RESOURCE_GROUP=$backend_resource_group"
            echo "TF_BACKEND_STORAGE_ACCOUNT=$backend_storage_account"
            echo "TF_BACKEND_CONTAINER=$backend_container"
            echo "TF_STATE_KEY=$state_key"
          } >> "$GITHUB_ENV"

      - name: Terraform init
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform refresh-only plan
        shell: bash
        run: |
          if [ -n "${TF_VAR_FILE}" ] && [ -f "${TF_VAR_FILE}" ]; then
            terraform plan -refresh-only -input=false -lock=false -var-file="${TF_VAR_FILE}" -out=tfdriftplan
          else
            terraform plan -refresh-only -input=false -lock=false -out=tfdriftplan
          fi

      - name: Drift summary
        run: echo "Read-only drift check completed. No Terraform apply ran."
