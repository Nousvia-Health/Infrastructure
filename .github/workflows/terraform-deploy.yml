name: Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment to deploy to
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod
      tfvars_file:
        description: Optional tfvars file under config/ to use (for example dev.tfvars)
        required: false
        default: dev.tfvars
  workflow_run:
    workflows:
      - Terraform CI
    types:
      - completed
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan-${{ github.event.inputs.environment || 'dev' }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_BACKEND_LOCATION: ${{ vars.TF_BACKEND_LOCATION || 'eastus' }}
      TF_WORKLOAD_STORAGE_ACCOUNT: ${{ vars.TF_WORKLOAD_STORAGE_ACCOUNT }}
      TF_VAR_FILE: ${{ github.event.inputs.tfvars_file || 'config/dev.tfvars' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure backend names
        shell: bash
        run: |
          deploy_environment="${{ github.event.inputs.environment || 'dev' }}"
          subscription_suffix="$(printf '%s' "$ARM_SUBSCRIPTION_ID" | tr -d '-' | cut -c1-9 | tr '[:upper:]' '[:lower:]')"

          backend_resource_group="${TF_BACKEND_RESOURCE_GROUP:-rg-nousvia-tfstate-${deploy_environment}}"
          backend_storage_account="${TF_BACKEND_STORAGE_ACCOUNT:-stnousviatf${deploy_environment}${subscription_suffix}}"
          backend_container="${TF_BACKEND_CONTAINER:-tfstate}"
          state_key="${TF_STATE_KEY:-${deploy_environment}/infrastructure.tfstate}"
          workload_storage_account="${TF_WORKLOAD_STORAGE_ACCOUNT:-stnviafiles${deploy_environment}${subscription_suffix}}"

          if ! [[ "$backend_storage_account" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error title=Invalid backend storage account::${backend_storage_account} must contain 3-24 lowercase letters or numbers."
            exit 1
          fi

          if ! [[ "$workload_storage_account" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error title=Invalid workload storage account::${workload_storage_account} must contain 3-24 lowercase letters or numbers."
            exit 1
          fi

          {
            echo "TF_BACKEND_RESOURCE_GROUP=$backend_resource_group"
            echo "TF_BACKEND_STORAGE_ACCOUNT=$backend_storage_account"
            echo "TF_BACKEND_CONTAINER=$backend_container"
            echo "TF_STATE_KEY=$state_key"
            echo "TF_VAR_storage_account_name=$workload_storage_account"
          } >> "$GITHUB_ENV"

          echo "Using backend resource group: $backend_resource_group"
          echo "Using backend storage account: $backend_storage_account"
          echo "Using backend container: $backend_container"
          echo "Using backend state key: $state_key"
          echo "Using default workload storage account: $workload_storage_account"

      - name: Create Terraform backend if needed
        shell: bash
        run: |
          az group create \
            --name "$TF_BACKEND_RESOURCE_GROUP" \
            --location "$TF_BACKEND_LOCATION" \
            --tags \
              environment="${{ github.event.inputs.environment || 'dev' }}" \
              workload="terraform-state" \
              managed-by="github-actions" \
            --only-show-errors

          if ! az storage account show \
            --name "$TF_BACKEND_STORAGE_ACCOUNT" \
            --resource-group "$TF_BACKEND_RESOURCE_GROUP" \
            --only-show-errors > /dev/null 2>&1; then
            az storage account create \
              --name "$TF_BACKEND_STORAGE_ACCOUNT" \
              --resource-group "$TF_BACKEND_RESOURCE_GROUP" \
              --location "$TF_BACKEND_LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --https-only true \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --allow-shared-key-access false \
              --tags \
                environment="${{ github.event.inputs.environment || 'dev' }}" \
                workload="terraform-state" \
                managed-by="github-actions" \
              --only-show-errors
          fi

          az storage container create \
            --name "$TF_BACKEND_CONTAINER" \
            --account-name "$TF_BACKEND_STORAGE_ACCOUNT" \
            --auth-mode login \
            --only-show-errors

      - name: Terraform init
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Select tfvars file if present
        id: tfvars
        shell: bash
        run: |
          selected_input="${{ github.event.inputs.tfvars_file || '' }}"
          if [ -n "$selected_input" ] && [ -f "$selected_input" ]; then
            echo "file=$selected_input" >> "$GITHUB_OUTPUT"
          elif [ -f "config/${{ github.event.inputs.environment || 'dev' }}.tfvars" ]; then
            echo "file=config/${{ github.event.inputs.environment || 'dev' }}.tfvars" >> "$GITHUB_OUTPUT"
          elif [ -f "config/dev.tfvars" ]; then
            echo "file=config/dev.tfvars" >> "$GITHUB_OUTPUT"
          elif [ -f "config/prod.tfvars" ]; then
            echo "file=config/prod.tfvars" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform plan
        shell: bash
        run: |
          vars_file="${{ steps.tfvars.outputs.file }}"
          if [ -n "$vars_file" ]; then
            terraform plan -input=false -var-file="$vars_file" -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: apply-${{ github.event.inputs.environment || 'dev' }}
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_BACKEND_LOCATION: ${{ vars.TF_BACKEND_LOCATION || 'eastus' }}
      TF_WORKLOAD_STORAGE_ACCOUNT: ${{ vars.TF_WORKLOAD_STORAGE_ACCOUNT }}
      TF_VAR_FILE: ${{ github.event.inputs.tfvars_file || 'config/dev.tfvars' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure backend names
        shell: bash
        run: |
          deploy_environment="${{ github.event.inputs.environment || 'dev' }}"
          subscription_suffix="$(printf '%s' "$ARM_SUBSCRIPTION_ID" | tr -d '-' | cut -c1-9 | tr '[:upper:]' '[:lower:]')"

          backend_resource_group="${TF_BACKEND_RESOURCE_GROUP:-rg-nousvia-tfstate-${deploy_environment}}"
          backend_storage_account="${TF_BACKEND_STORAGE_ACCOUNT:-stnousviatf${deploy_environment}${subscription_suffix}}"
          backend_container="${TF_BACKEND_CONTAINER:-tfstate}"
          state_key="${TF_STATE_KEY:-${deploy_environment}/infrastructure.tfstate}"
          workload_storage_account="${TF_WORKLOAD_STORAGE_ACCOUNT:-stnviafiles${deploy_environment}${subscription_suffix}}"

          if ! [[ "$backend_storage_account" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error title=Invalid backend storage account::${backend_storage_account} must contain 3-24 lowercase letters or numbers."
            exit 1
          fi

          if ! [[ "$workload_storage_account" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error title=Invalid workload storage account::${workload_storage_account} must contain 3-24 lowercase letters or numbers."
            exit 1
          fi

          {
            echo "TF_BACKEND_RESOURCE_GROUP=$backend_resource_group"
            echo "TF_BACKEND_STORAGE_ACCOUNT=$backend_storage_account"
            echo "TF_BACKEND_CONTAINER=$backend_container"
            echo "TF_STATE_KEY=$state_key"
            echo "TF_VAR_storage_account_name=$workload_storage_account"
          } >> "$GITHUB_ENV"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: .

      - name: Validate downloaded plan
        shell: bash
        run: |
          if [ ! -s tfplan ]; then
            echo "::error title=Missing Terraform plan::The deployment plan artifact was not downloaded as tfplan."
            exit 1
          fi

      - name: Terraform init
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_BACKEND_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Select tfvars file if present
        id: tfvars
        shell: bash
        run: |
          selected_input="${{ github.event.inputs.tfvars_file || '' }}"
          if [ -n "$selected_input" ] && [ -f "$selected_input" ]; then
            echo "file=$selected_input" >> "$GITHUB_OUTPUT"
          elif [ -f "config/${{ github.event.inputs.environment || 'dev' }}.tfvars" ]; then
            echo "file=config/${{ github.event.inputs.environment || 'dev' }}.tfvars" >> "$GITHUB_OUTPUT"
          elif [ -f "config/dev.tfvars" ]; then
            echo "file=config/dev.tfvars" >> "$GITHUB_OUTPUT"
          elif [ -f "config/prod.tfvars" ]; then
            echo "file=config/prod.tfvars" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform apply
        shell: bash
        run: |
          vars_file="${{ steps.tfvars.outputs.file }}"
          for attempt in 1 2 3 4 5; do
            echo "Terraform apply attempt ${attempt}/5"

            if [ "$attempt" -gt 1 ]; then
              echo "Refreshing state and creating a new plan before retrying."
              if [ -n "$vars_file" ]; then
                if ! terraform plan -input=false -var-file="$vars_file" -out=tfplan; then
                  echo "Terraform plan failed while Azure is still completing the previous operation."
                  if [ "$attempt" -lt 5 ]; then
                    sleep 90
                  fi
                  continue
                fi
              else
                if ! terraform plan -input=false -out=tfplan; then
                  echo "Terraform plan failed while Azure is still completing the previous operation."
                  if [ "$attempt" -lt 5 ]; then
                    sleep 90
                  fi
                  continue
                fi
              fi
            fi

            if [ -n "$vars_file" ]; then
              terraform apply -input=false tfplan && exit 0
            else
              terraform apply -input=false tfplan && exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Azure may still be completing a previous Storage Account operation; waiting 90 seconds before retrying."
              sleep 90
            fi
          done

          echo "Terraform apply failed after 5 attempts."
          exit 1
